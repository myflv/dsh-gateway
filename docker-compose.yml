services:
  server:
    image: ghcr.io/myflv/dsh-gateway
    restart: unless-stopped
    environment:
      AUTH_USER: admin
      AUTH_PASSWORD: admin
    ports:
      - 8080:8080
      - 8443:8443
    volumes:
      # /root = 工作区（cwd + HOME，dsh 配置派生 /root/.dsh），删掉 ./workspace 重来
      - ./workspace:/root
      - ./ssh:/root/.ssh
