services:
  server:
    image: ghcr.io/myflv/dsh-gateway
    restart: unless-stopped
    environment:
      AUTH_USER: admin
      AUTH_PASSWORD: admin
    ports:
      - 8080:8080
      - 8443:8443
    volumes:
      # /root = 工作区（cwd + HOME，dsh 配置 /root/.dsh、ssh 密钥 /root/.ssh 都在卷里），删掉 ./workspace 重来
      - ./workspace:/root
