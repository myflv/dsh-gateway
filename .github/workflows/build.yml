name: build-push

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'   # 每天检查 dsh 是否有新版本
  workflow_dispatch:

permissions:
  packages: write   # 推送 GHCR
  actions: read     # build-push-action 的 gha 缓存

# 定时任务与 push 分开成组：被延迟执行的定时构建不会取消刚推送触发的构建
concurrency:
  group: dsh-gateway-build-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 dsh 最新版本（以 GitHub release 为准，npm latest 会滞后）
        id: check
        run: |
          # 纯 prerelease 仓库没有 releases/latest（404）。npm 发布晚于 GitHub
          # release：一次 packument（全部已发布版本）与 release 列表做交集，取
          # 最新可装版本，而不是整个跳过（否则代码修复永远进不了镜像）。
          # npm 版本只增不减，选择随列表增长单调前进，新版本上 npm 后定时任务
          # 自动升级。--max-time 防 registry 慢速时挂起。
          NEW=$(curl -fsS --max-time 30 "https://registry.npmjs.org/@deepseek-ai/dsh" -o /tmp/dsh-pack.json \
            && curl -fsS --max-time 30 "https://api.github.com/repos/deepseek-ai/deepseek-harness/releases?per_page=100" \
              | jq -r --slurpfile pk /tmp/dsh-pack.json '
                  ($pk[0]["versions"] | keys) as $published
                  | [ .[] | .name | sub("^v";"")
                      | select(test("[0-9]+.[0-9]+.[0-9]+"))
                      | select(. as $v | $published | index($v)) ]
                  | .[0]')
          if [ -z "$NEW" ]; then
            echo "所有 release 均未发布到 npm，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "dsh_version=$NEW" >> "$GITHUB_OUTPUT"
          fi
          # 定时触发且该版本镜像已存在 -> 跳过；代码变更或手动触发 -> 总是构建
          if [ "${{ github.event_name }}" = "schedule" ] \
            && docker manifest inspect "ghcr.io/${{ github.repository }}:$NEW" >/dev/null 2>&1; then
            echo "镜像已存在，跳过"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        if: steps.check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 qemu（arm64 构建模拟）
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: 设置 buildx（docker-container driver，gha 缓存导出必需）
        if: steps.check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # amd64 + arm64（NAS 等 ARM 设备自动拉对应架构）
          platforms: linux/amd64,linux/arm64
          # gha 缓存：node 阶段（最耗时）在版本不变时直接命中；
          # ignore-error 让缓存服务不可用时构建不中断
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.check.outputs.dsh_version }}
          build-args: |
            DSH_VERSION=${{ steps.check.outputs.dsh_version }}
